# ------------------------------------------------------------
# Azure DevOps Pipeline - Hostpool Infra Deployment
# Deploys RG + Storage + KeyVault + LogAnalytics + Hostpool/Workspace/AppGroup
# ------------------------------------------------------------
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: avd-hostpool-vars   # Variable group with RG, names, etc.

stages:
  - stage: Build
    jobs:
      - job: TerraformBuild
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: 'AzureRM-AVD'
              backendAzureRmResourceGroupName: '$(rg_name)'
              backendAzureRmStorageAccountName: '$(storage_account_name)'
              backendAzureRmContainerName: '$(container_name)'
              backendAzureRmKey: 'hostpool.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  - stage: Plan
    jobs:
      - job: TerraformPlan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: 'AzureRM-AVD'
              vars: |
                rg_name=$(rg_name)
                location=$(location)
                storage_account_name=$(storage_account_name)
                container_name=$(container_name)
                kv_name=$(kv_name)
                law_name=$(law_name)
                hostpool_name=$(hostpool_name)
                workspace_name=$(workspace_name)
                application_group_name=$(application_group_name)

          # Save plan output for review
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/terraform/tfplan'
              ArtifactName: 'tfplan'
              publishLocation: 'Container'

  - stage: Apply
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        environment: 'avd-infra'   # Environment with approvals configured
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: tfplan

                - task: TerraformTask@5
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
                    environmentServiceNameAzureRM: 'AzureRM-AVD'
                    commandOptions: 'tfplan'
